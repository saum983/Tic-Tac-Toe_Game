<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="msgContainer hide">
        <p id="msg">WINNER</p>
        <button id="newBtn"><b>New Game</b></button>
    </div>
    <main>
        <h1 id="heading">Tic Tac Toe Game</h1>
        <div class="container">
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        <button id="resetBtn"><b>Reset Game</b></button>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.8.1/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0"></script>
    <script src="script.js"></script>
</body>
</html>
